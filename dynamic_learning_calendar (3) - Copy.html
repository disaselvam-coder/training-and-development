<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Learning Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        /* The specific shape requested for day cells from the user's original code */
        .leaf-shape {
            border-radius: 20px 4px 20px 4px;
        }
        /* Specific shape requested for event pills from the user's original code */
        .event-pill {
            border-radius: 8px 2px 8px 2px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .event-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        @media print {
            @page {
                size: A3 landscape;
                margin: 10mm;
            }
            body {
                background-color: white !important;
            }
            .no-print {
                display: none !important;
            }
            .print-full-width {
                width: 100% !important;
                max-width: none !important;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .add-btn {
                display: none !important;
            }
        }
        
        [contenteditable="true"] {
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.2s;
        }
        [contenteditable="true"]:hover, [contenteditable="true"]:focus {
            border-bottom: 1px dashed #cbd5e1;
            background-color: rgba(0,0,0,0.02);
        }
        .logo-container {
            position: relative;
            cursor: pointer;
            border: 2px dashed transparent;
            transition: all 0.2s;
        }
        .logo-container:hover {
            border-color: #94a3b8;
            background-color: rgba(0,0,0,0.02);
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .logo-actions {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 8px;
            border-radius: 8px;
            gap: 8px;
            white-space: nowrap;
            z-index: 10;
        }
        .logo-container:hover .logo-actions {
            display: flex;
        }
        .day-cell .add-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .day-cell:hover .add-btn {
            opacity: 1;
        }
    </style>
</head>

                    { id: 'e76', date: '2026-04-29', title: 'Usage of PPE’s', dept: 'Mills', time: '2.30 PM', type: 'Internal' },
                    { id: 'e77', date: '2026-04-30', title: 'OJT on Role of Hopper Level Control', dept: 'Sinter Plant', time: '2.30 PM', type: 'Internal' },
                    { id: 'e78', date: '2026-04-27', title: 'Emergency Response Control Plan', dept: 'SIS Security department', time: '2.30 PM', type: 'Internal' },
                    { id: 'e79', date: '2026-04-28', title: 'LOTO - SME Module', dept: 'Mills', time: '2.30 PM', type: 'Internal' },
                    { id: 'e80', date: '2026-04-29', title: 'Permit to Work - SME Module', dept: 'Quality Assurance', time: '2.30 PM', type: 'Internal' },
                    { id: 'e81', date: '2026-04-30', title: 'Management of Change', dept: 'Quality Assurance', time: '2.30 PM', type: 'Internal' },
                    { id: 'e82', date: '2026-04-27', title: 'Confined Space Entry', dept: 'Mills', time: '2.30 PM', type: 'Internal' },
                    { id: 'e83', date: '2026-04-28', title: 'LOTO', dept: 'Mills', time: '2.30 PM', type: 'Internal' }
                ],
                actual: []
            },
            savedTexts: {
                headerTitle1: 'JSW Steel Salem',
                headerTitle2: 'Learning & Development',
                headerDocId: 'IMSR/GS/HR – TRD/13'
            },
            logos: {
                logo1: null,
                logo2: "https://upload.wikimedia.org/wikipedia/commons/3/3c/JSW_Group_logo.svg"
            }
        };

        defaultData.events.actual = defaultData.events.plan.map(e => ({...e, type: 'Plan Achieved'}));

        const storageKey = 'jsw_calendar_data_v16'; // Incremented version to apply default changes fresh
        let appData = JSON.parse(localStorage.getItem(storageKey)) || defaultData;

        function saveToHistory() {
            history = history.slice(0, historyIndex + 1);
            history.push(JSON.stringify(appData));
            historyIndex++;
            if (history.length > 30) history.shift();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                appData = JSON.parse(history[historyIndex]);
                saveData();
                renderCalendar();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                appData = JSON.parse(history[historyIndex]);
                saveData();
                renderCalendar();
            }
        }

        function saveData() {
            localStorage.setItem(storageKey, JSON.stringify(appData));
        }

        document.getElementById('headerTitle1').innerText = appData.savedTexts.headerTitle1;
        document.getElementById('headerTitle2').innerText = appData.savedTexts.headerTitle2;
        document.getElementById('headerDocId').innerText = appData.savedTexts.headerDocId;
        if (appData.logos.logo1) document.getElementById('logo1-img').src = appData.logos.logo1;
        
        // For logo 2, since we separated text, we just load the base image. The user can still replace it.
        if (appData.logos.logo2) document.getElementById('logo2-img').src = appData.logos.logo2;

        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const calendarGrid = document.getElementById('calendarGrid');
        const modal = document.getElementById('eventModal');
        const dynamicTitle = document.getElementById('dynamic-calendar-title');
        const legendContainer = document.getElementById('legendContainer');
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        monthSelect.addEventListener('change', renderCalendar);
        yearSelect.addEventListener('input', renderCalendar);

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
        });

        function setupModalEnterNavigation() {
            const inputs = ['eventTopic', 'eventDept', 'eventTime', 'eventType', 'btnSaveEvent'];
            inputs.forEach((id, index) => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            if (index < inputs.length - 1) {
                                document.getElementById(inputs[index + 1]).focus();
                            } else if (id === 'btnSaveEvent') {
                                saveEvent();
                            }
                        }
                    });
                }
            });
        }
        setupModalEnterNavigation();

        function renderCalendar() {
            const year = parseInt(yearSelect.value) || 2026;
            const month = parseInt(monthSelect.value);
            const modeText = currentMode === 'plan' ? 'Plan' : 'Actual';
            dynamicTitle.innerText = `Learning Calendar ${modeText} – ${months[month]} ${year}`;
            
            renderLegends();
            
            calendarGrid.innerHTML = '';
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startOffset = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.className = "bg-slate-100/50 leaf-shape opacity-50 min-h-[140px]"; // Restored original shape
                calendarGrid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateString = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const cell = document.createElement('div');
                // Applied the 4px border black and leaf shape exactly as in the user's base code
                cell.className = "bg-white leaf-shape p-2.5 min-h-[140px] border-4 border-black cursor-default flex flex-col day-cell relative group";
                
                const headerDiv = document.createElement('div');
                headerDiv.className = "flex justify-between items-start mb-2";
                
                const addBtn = document.createElement('button');
                addBtn.className = "add-btn w-6 h-6 rounded-full bg-black text-white flex items-center justify-center font-bold text-sm hover:scale-110 cursor-pointer shadow-sm";
                addBtn.innerHTML = "+";
                addBtn.onclick = () => openModal(dateString);
                headerDiv.appendChild(addBtn);

                const dateNum = document.createElement('div');
                dateNum.className = "text-[1.4rem] font-bold text-slate-400";
                dateNum.innerText = String(day).padStart(2, '0');
                headerDiv.appendChild(dateNum);
                cell.appendChild(headerDiv);

                const dayEvents = appData.events[currentMode].filter(e => e.date === dateString);
                dayEvents.forEach(evt => {
                    const evtDiv = document.createElement('div');
                    // Applies the user's specific original color palette classes
                    const colorClass = colors[evt.type] || 'bg-slate-800 text-white border-2 border-black';
                    evtDiv.className = `event-pill p-2 mb-2 cursor-pointer shadow-sm ${colorClass}`;
                    
                    // Logic to completely hide the time block if time is blank
                    const timeHtml = evt.time && evt.time.trim() !== '' ? `<div class="mt-2 font-bold text-[10px] bg-black/10 inline-block px-2 py-0.5 rounded">${evt.time}</div>` : '';
                    
                    evtDiv.innerHTML = `
                        <div class="font-extrabold text-xs leading-tight mb-0.5">${evt.title}</div>
                        <div class="text-[11px] font-semibold opacity-90">${evt.dept}</div>
                        ${timeHtml}
                    `;
                    evtDiv.onclick = (e) => { e.stopPropagation(); openModal(dateString, evt); };
                    cell.appendChild(evtDiv);
                });
                calendarGrid.appendChild(cell);
            }
        }

        function renderLegends() {
            legendContainer.innerHTML = '';
            const types = currentMode === 'plan' ? planTypes : actualTypes;
            types.forEach(type => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2";
                
                const dot = document.createElement('div');
                const bgClass = colors[type] ? colors[type].split(' ')[0] : 'bg-white';
                dot.className = `w-[18px] h-[18px] rounded-sm border-2 border-black ${bgClass}`;
                
                const label = document.createElement('span');
                label.className = "text-sm font-extrabold text-black uppercase tracking-wide";
                label.innerText = type;
                
                div.appendChild(dot);
                div.appendChild(label);
                legendContainer.appendChild(div);
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnPlan').className = mode === 'plan' ? "px-6 py-2 rounded font-bold text-sm transition-all shadow bg-white text-blue-700" : "px-6 py-2 rounded font-bold text-sm transition-all text-slate-500 hover:text-slate-800";
            document.getElementById('btnActual').className = mode === 'actual' ? "px-6 py-2 rounded font-bold text-sm transition-all shadow bg-white text-blue-700" : "px-6 py-2 rounded font-bold text-sm transition-all text-slate-500 hover:text-slate-800";
            renderCalendar();
        }

        function openModal(dateString, existingEvent = null) {
            selectedDate = dateString;
            editingEventId = existingEvent ? existingEvent.id : null;
            document.getElementById('modalTitle').innerText = existingEvent ? 'Edit Event' : 'Add Event';
            document.getElementById('eventTopic').value = existingEvent ? existingEvent.title : '';
            document.getElementById('eventDept').value = existingEvent ? existingEvent.dept : '';
            
            const timeInput = document.getElementById('eventTime');
            const ampmSelect = document.getElementById('eventAMPM');
            
            if (existingEvent && existingEvent.time) {
                const match = existingEvent.time.match(/^(.+?)\s*(AM|PM)?$/);
                timeInput.value = match ? match[1].trim() : '';
                ampmSelect.value = match && match[2] ? match[2] : 'PM'; // Default to PM if parsing fails but time exists
            } else {
                timeInput.value = '';
                ampmSelect.value = 'PM'; // Default selection
            }

            document.getElementById('btnDelete').classList.toggle('hidden', !existingEvent);
            
            const select = document.getElementById('eventType');
            select.innerHTML = '';
            const opts = currentMode === 'plan' ? planTypes : actualTypes;
            opts.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt;
                el.textContent = opt;
                select.appendChild(el);
            });
            if (existingEvent) select.value = existingEvent.type;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Auto focus on the first input field when modal opens
            setTimeout(() => {
                document.getElementById('eventTopic').focus();
            }, 100);
        }

        function saveEvent() {
            const title = document.getElementById('eventTopic').value.trim();
            const dept = document.getElementById('eventDept').value.trim();
            let time = document.getElementById('eventTime').value.trim();
            const ampm = document.getElementById('eventAMPM').value;
            const type = document.getElementById('eventType').value;

            // Ensures that if time is left blank, it stays completely blank
            if (time) {
                time = ampm ? `${time} ${ampm}` : time;
            } else {
                time = "";
            }

            if (!title) return alert('Event topic is required');

            saveToHistory();

            if (editingEventId) {
                if (currentMode === 'plan') {
                    const p = appData.events.plan.findIndex(e => e.id === editingEventId);
                    if (p > -1) appData.events.plan[p] = {...appData.events.plan[p], title, dept, time, type};
                    const a = appData.events.actual.findIndex(e => e.id === editingEventId);
                    if (a > -1) {
                        appData.events.actual[a].title = title;
                        appData.events.actual[a].dept = dept;
                        appData.events.actual[a].time = time;
                    }
                } else {
                    const a = appData.events.actual.findIndex(e => e.id === editingEventId);
                    if (a > -1) appData.events.actual[a] = {...appData.events.actual[a], title, dept, time, type};
                }
            } else {
                const newId = Date.now().toString();
                const newEvent = {id: newId, date: selectedDate, title, dept, time, type};
                if (currentMode === 'plan') {
                    appData.events.plan.push(newEvent);
                    appData.events.actual.push({...newEvent, type: 'Plan Achieved'});
                } else {
                    appData.events.actual.push(newEvent);
                }
            }
            saveData();
            closeModal();
            renderCalendar();
        }

        function deleteEvent() {
            if (!confirm("Delete this event?")) return;
            saveToHistory();
            if (currentMode === 'plan') {
                appData.events.plan = appData.events.plan.filter(e => e.id !== editingEventId);
                appData.events.actual = appData.events.actual.filter(e => e.id !== editingEventId);
            } else {
                appData.events.actual = appData.events.actual.filter(e => e.id !== editingEventId);
            }
            saveData();
            closeModal();
            renderCalendar();
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveBackup() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `JSW_Calendar_Backup.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function restoreBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveData();
                    location.reload();
                } catch(err) {
                    alert("Invalid backup file");
                }
            };
            reader.readAsText(file);
        }

        function triggerUpload(id) {
            document.getElementById(id + '-upload').click();
        }

        function handleUpload(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(id + '-img').src = e.target.result;
                    appData.logos[id] = e.target.result;
                    saveData();
                };
                reader.readAsDataURL(file);
            }
        }

        function clearLogo(id) {
            const empty = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'></svg>";
            document.getElementById(id + '-img').src = empty;
            appData.logos[id] = empty;
            saveData();
        }

        // Initialize
        saveToHistory();
        renderCalendar();
    </script>
